# Configuração do Netlify para PWA Stroop
[build]
  # Diretório de publicação (arquivos estáticos)
  publish = "."
  
  # Comando de build (se necessário)
  # command = "npm run build"

# Configurações de headers para PWA
[[headers]]
  for = "/*"
  [headers.values]
    # Cache control para assets
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    # Service worker não deve ser cacheado pelo navegador
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Servir arquivos HTML sem extensão
[[redirects]]
  from = "/stroop"
  to = "/stroop.html"
  status = 200

# Redirecionar 404s para a página index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
